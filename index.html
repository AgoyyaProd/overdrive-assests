<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OverDrive – 2v2 Trackmania League</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/AgoyyaProd/overdrive-assests/main/favicon.svg">
<script>
// The logo is white-on-transparent by default (visible on dark browser tabs/OS themes)
// but swaps to a black-on-transparent version when the user's system is in light mode,
// so the tab icon stays visible either way.
(function() {
  var FAVICON_WHITE = "https://raw.githubusercontent.com/AgoyyaProd/overdrive-assests/main/favicon.svg";
  var FAVICON_BLACK = "https://raw.githubusercontent.com/AgoyyaProd/overdrive-assests/main/favicon-black.svg";
  function applyFavicon() {
    var isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    var link = document.getElementById('favicon');
    if (link) link.href = isLight ? FAVICON_BLACK : FAVICON_WHITE;
  }
  applyFavicon();
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) mq.addEventListener('change', applyFavicon);
    else if (mq.addListener) mq.addListener(applyFavicon); // older Safari
  }
})();
</script>
<link rel="stylesheet" href="https://use.typekit.net/ejz8nvd.css">
<style>
/* ━━━ TOKENS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root{
  --bg:#060606; --bg-c:#0f0f0f; --bg-c2:#0a0a0a;
  --acc:#FF6A00; --acc-dim:rgba(255,106,0,.13);
  --gold:rgba(255,186,74,.48); --gold-leg:#FFBA4A;
  --bar:rgba(255,107,0,.48);   --bar-leg:#FF6B00;
  --rel:rgba(205,0,0,.48);     --rel-leg:#CD0000;
  --champ:rgba(255,215,0,.55); --champ-leg:#FFD700;
  --row:rgba(35,35,35,.55);
  --txt:#fff; --muted:rgba(255,255,255,.52); --dim:rgba(255,255,255,.18);
  --brd:rgba(255,255,255,.055); --brd2:rgba(255,255,255,.11);
  --r:0px; --r-sm:0px;
  /* area-extended = headings, area = everything else */
  --ft:area-extended,area,sans-serif;
  --fb:area-extended,area,sans-serif;
  --hh:70px;
  --section-gap:120px;
  --block-gap:120px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ft);font-weight:500;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;position:relative}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
img{display:block;max-width:100%}
select{appearance:none;-webkit-appearance:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* ━━━ FIRE BG ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 52% 60% at -6% 16%, rgba(255,55,0,.58) 0%, rgba(190,25,0,.22) 30%, transparent 60%),
    radial-gradient(ellipse 52% 60% at 106% 16%, rgba(255,55,0,.58) 0%, rgba(190,25,0,.22) 30%, transparent 60%),
    radial-gradient(ellipse 90% 16% at 50% 0%, rgba(170,20,0,.44) 0%, transparent 52%);
  animation:flk 7s ease-in-out infinite;
}
@keyframes flk{0%,100%{opacity:1}50%{opacity:.8}}
#nav,#app,footer{position:relative;z-index:1}

/* ━━━ NAV ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#nav{
  position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:1000;
  background-color:transparent;
  background-image:url('https://raw.githubusercontent.com/AgoyyaProd/overdrive-assests/main/nav-footer-texture.jpg');
  background-size:cover;background-position:center;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.ni{position:relative;z-index:10;width:66%;max-width:3200px;margin:0 auto;height:100%;display:flex;align-items:center;padding:0 32px;gap:16px}
@media(max-width:768px){.ni{width:100%}}
.nl{margin-left:auto;padding-left:80px}

/* brand */
.nb{display:flex;align-items:center;gap:0;cursor:pointer;flex-shrink:0}
.nb img{height:36px;object-fit:contain}

/* nav links with dropdown */
.nl{display:flex;align-items:center;gap:0}
.nav-item{position:relative;display:flex;align-items:center}
.nav-item.open .dd-arr{transform:rotate(180deg)}
.nlk{
  font-family:var(--ft);font-weight:400;font-size:13px;letter-spacing:.09em;text-transform:uppercase;
  color:#fff;padding:8px 13px;cursor:pointer;
  transition:color .15s,background .15s;white-space:nowrap;display:flex;align-items:center;gap:5px;
}
.nlk:hover{color:#fff;font-weight:950}
.nlk.on{color:#fff;font-weight:950}
.dd-arr{display:inline-flex;align-items:center;opacity:.85;transition:transform .2s}

/* dropdown: visibility is controlled by JS via the .open class on .nav-item,
   not by :hover, so it never closes mid-move along an imperfect pointer path. */
.dd{
  position:absolute;top:100%;left:50%;transform:translateX(-50%);
  background:#111;border:1px solid var(--brd2);
  padding:6px;min-width:170px;z-index:200;
  display:flex;flex-direction:column;gap:2px;
  box-shadow:0 16px 40px rgba(0,0,0,.6);
  margin-top:8px;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .12s ease;
}
.nav-item.open .dd{opacity:1;visibility:visible;pointer-events:auto}
/* Solid invisible bridge spanning the gap, so the pointer is never over "nothing"
   between the nav item and the menu. */
.dd::before{content:'';position:absolute;top:-12px;left:-12px;right:-12px;height:14px}
.ddi{
  padding:9px 14px;font-family:var(--ft);font-weight:500;
  font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#fff;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.ddi:hover{color:var(--acc);background:var(--acc-dim)}
.ddi-sep{height:1px;background:var(--brd);margin:4px 0}
/* Submenu expands vertically below its parent row, inside the dropdown's flow,
   so it reads as a nested list rather than a second floating panel. */
.ddi-sub{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:0}
.ddi-sub-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;cursor:default}
.dd-sub-arr{display:inline-flex;align-items:center;opacity:.7;transition:transform .2s}
.ddi-sub.open .dd-sub-arr{transform:rotate(90deg)}
.dd-sub{
  display:flex;flex-direction:column;gap:2px;
  padding:0 0 0 12px;margin:0;
  border-left:1px solid var(--brd2);
  max-height:0;overflow:hidden;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:max-height .18s ease,opacity .12s ease,margin .18s ease;
}
.ddi-sub.open .dd-sub{
  max-height:300px;margin:4px 0 2px 8px;
  opacity:1;visibility:visible;pointer-events:auto;
}

/* ━━━ APP ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#app{padding-top:var(--hh);min-height:100vh}

/* ━━━ FOOTER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
footer{
  border-top:1px solid rgba(255,255,255,.12);
  background-color:transparent;
  background-image:url('https://raw.githubusercontent.com/AgoyyaProd/overdrive-assests/main/nav-footer-texture.jpg');
  background-size:cover;background-position:center;position:relative;
}
.fi{position:relative;z-index:2;width:66%;max-width:3200px;margin:0 auto;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:768px){.fi{width:100%}}
.fb2{display:flex;align-items:center;gap:10px;font-family:var(--ft);font-weight:900;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.fb2 img{height:36px;object-fit:contain}
.fr-block{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px;text-align:right}
.fc2{color:#fff;font-family:var(--ft);font-weight:900;font-size:13px;letter-spacing:.02em}
.fl2{color:rgba(255,255,255,.55);font-family:var(--ft);font-weight:500;font-size:13px;letter-spacing:.02em}
.fl2 a{color:rgba(255,255,255,.92);text-decoration:none;cursor:pointer;transition:color .15s}
.fl2 a:hover{color:#fff;text-decoration:underline}
.fl{display:flex;gap:18px;flex-wrap:wrap}
.fl a{color:var(--muted);font-family:var(--ft);font-size:12px;font-weight:500;transition:color .15s}
.fl a:hover{color:var(--txt)}
.fc{color:var(--dim);font-family:var(--ft);font-size:12px}

/* ━━━ HOME MATCH CARD ━━━━━━━━━━━━━━━━━━━━━━ */
.hmc{background:var(--bg-c);border:1px solid var(--brd);padding:10px 16px;margin-bottom:8px;cursor:default;transition:border-color .15s}
.hmc-done{border-left:3px solid var(--acc);cursor:pointer}
.hmc-done:hover{border-color:var(--acc)}
.hmc-date{font-family:var(--ft);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
.hmc-teams{display:flex;align-items:center;gap:10px;justify-content:space-between}
.hmc-team{display:flex;align-items:center;gap:8px;flex:1}
.hmc-team-r{flex-direction:row-reverse;text-align:right}
.hmc-tn{font-family:var(--ft);font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hmc-score{font-family:var(--ft);font-size:26px;font-weight:900;color:var(--txt);min-width:80px;text-align:center;flex-shrink:0}
.hmc-foot{display:flex;align-items:center;justify-content:flex-end;margin-top:8px;gap:8px}

/* ━━━ LOADING ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.ldg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:16px}
.sp{width:32px;height:32px;border:2.5px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldg-l{font-family:var(--ft);font-weight:900;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* ━━━ PAGE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.pg{width:66%;max-width:3200px;margin:0 auto;padding:var(--section-gap) 40px}
@media(max-width:768px){.pg{width:100%;padding:56px 20px}}

/* ━━━ TITLE SYSTEM ━━━━━━━━━━━━━━━━━━━━━━━━ */
/* section eyebrow – area normale */
.sl{font-family:var(--ft);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt);opacity:.65;margin-bottom:5px}
.sl-label{font-family:var(--ft);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
/* big titles – area extended uniquement */
.dt{font-family:var(--ft);font-weight:900;font-size:54px;text-transform:uppercase;line-height:.9;margin-bottom:32px}

/* ━━━ SCHEDULE DAY NAVIGATOR ━━━━━━━━━━━━━━━━ */
.sch-nav{display:flex;align-items:center;margin-bottom:28px}
.sch-list{max-height:900px;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding-right:8px}
.sch-list::-webkit-scrollbar{width:6px}
.sch-list::-webkit-scrollbar-track{background:transparent}
.sch-list::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:99px}
.sch-nav-dow{font-family:var(--ft);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sch-nav-ctrl{display:inline-flex;align-items:center;background:rgba(255,255,255,.055);border-radius:999px;padding:5px;gap:3px;flex-shrink:0}
.sch-arr{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--txt);font-size:19px;cursor:pointer;transition:background .15s;flex-shrink:0}
.sch-arr:hover{background:rgba(255,255,255,.08)}
.sch-today{padding:13px 30px;border-radius:999px;font-family:var(--ft);font-weight:900;font-size:16px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all .15s}
.sch-today.on{background:rgba(255,106,0,.88);color:#fff}
.sch-today:not(.on):hover{color:var(--txt)}
.dt em{font-style:normal;color:var(--acc)}
.dt-md{font-family:var(--ft);font-weight:900;font-size:38px;text-transform:uppercase;line-height:.9}
@media(max-width:600px){.dt{font-size:36px}.dt-md{font-size:26px}}

/* ━━━ ABOUT SECTION ━━━━━━━━━━━━━━━━━━━━━━━ */
.ab-wrap{width:66%;max-width:3200px;margin:0 auto;padding:var(--section-gap) 40px var(--block-gap);display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
@media(max-width:900px){.ab-wrap{width:100%;grid-template-columns:1fr;padding:56px 20px;gap:32px}}
.ab-h1{font-family:var(--ft);font-weight:900;font-size:40px;text-transform:uppercase;line-height:.95;margin-bottom:26px}
.ab-h1 em{font-style:normal;color:var(--acc)}
.ab-p{font-family:var(--ft);font-weight:300;font-size:13px;line-height:1.85;color:var(--muted);margin-bottom:12px}

/* ━━━ POWER RANKING EXPLAINER ━━━━━━━━━━━━━ */
.pr-exp{margin-top:64px;padding-top:44px;border-top:1px solid var(--brd)}
.pr-intro{font-family:var(--ft);font-weight:500;font-size:15px;line-height:1.75;color:var(--muted);margin-bottom:44px;text-wrap:pretty}
/* Numbered section heads: the accent rule and index echo the match-card treatment. */
.pr-sec{display:flex;align-items:center;gap:12px;margin:0 0 20px}
.pr-sec-i{font-family:var(--ft);font-weight:900;font-size:11px;letter-spacing:.1em;color:var(--acc)}
.pr-sec-t{font-family:var(--ft);font-weight:900;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt)}
.pr-sec-r{flex:1;height:1px;background:var(--brd)}
.pr-block{margin-bottom:52px}
.pr-note{font-family:var(--ft);font-weight:500;font-size:13px;line-height:1.75;color:var(--muted);margin-top:16px;text-wrap:pretty}
.pr-note b{font-weight:700;color:var(--txt)}

/* Base-score cards, styled like the About page stat boxes. */
.pr-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.pr-card{background:var(--bg-c);border:1px solid var(--brd);padding:22px 24px}
.pr-card-n{font-family:var(--ft);font-weight:900;font-size:32px;line-height:1;margin-bottom:8px}
.pr-card-l{font-family:var(--ft);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* The four scoring criteria. */
/* Four across on one row. Each card is narrow at this width, so the copy is kept
   short and the type stepped down to match. Below ~1200px four columns squeeze the
   cards under 180px, so it drops to two, then one. */
.pr-crit{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:1200px){.pr-crit{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.pr-crit{grid-template-columns:1fr}}
.pr-crit-i{background:var(--bg-c);border:1px solid var(--brd);border-left:2px solid var(--acc);padding:16px 16px}
.pr-crit-h{font-family:var(--ft);font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt);margin-bottom:7px}
.pr-crit-d{font-family:var(--ft);font-weight:500;font-size:12px;line-height:1.65;color:var(--muted);text-wrap:pretty}
.pr-crit-d b{font-weight:700;color:var(--txt)}

/* Stage multipliers: a bar chart reads the weighting faster than a plain list. */
.pr-mult{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.pr-m{display:grid;grid-template-columns:170px 1fr 58px;align-items:center;gap:14px;padding:9px 16px;background:rgba(255,255,255,.03)}
.pr-m-l{font-family:var(--ft);font-weight:500;font-size:12px;color:var(--muted)}
.pr-m-bar{height:6px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.pr-m-fill{position:absolute;inset:0 auto 0 0;background:var(--acc)}
.pr-m-v{font-family:var(--ft);font-weight:900;font-size:13px;color:var(--acc);text-align:right}
@media(max-width:600px){.pr-m{grid-template-columns:120px 1fr 48px;gap:10px;padding:9px 12px}}

/* ━━━ HOME MATCH CARD ━━━━━━━━━━━━━━━━━━━━━━ */

.hmc-tn{font-family:var(--ft);font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hmc-score{font-family:var(--ft);font-size:26px;font-weight:900;color:var(--txt);min-width:80px;text-align:center;flex-shrink:0}
.hmc-foot{display:flex;align-items:center;justify-content:flex-end;margin-top:8px;gap:8px}

/* ━━━ LOADING ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

.sp{width:32px;height:32px;border:2.5px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldg-l{font-family:var(--ft);font-weight:900;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* ━━━ PAGE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

/* big titles – area extended uniquement */

/* ━━━ SECTION HEADER ━━━━━━━━━━━━━━━━━━━━━━ */

/* subsection label */

/* ━━━ DIV TOGGLE ━━━━━━━━━━━━━━━━━━━━━━━━━ */
.dtog{display:inline-flex;background:rgba(255,255,255,.055);border-radius:999px;padding:3px;gap:3px;margin-bottom:22px}
.dtb{padding:8px 20px;border-radius:999px;font-family:var(--ft);font-weight:900;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);transition:all .15s;cursor:pointer}

/* ━━━ STANDINGS ━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.st-wrap{overflow-x:auto}
/* Ranking table: caps the visible height at about ten rows and scrolls the rest.
   62px per row (52px row + 10px gap) plus the header. */
.st-wrap.st-scroll{max-height:calc(62px * 10 + 44px);overflow-y:auto}
.st-wrap.st-scroll .stt thead th{position:sticky;top:0;z-index:20}
.stt{width:100%;border-collapse:separate;border-spacing:0 0}
.th-tip{position:relative;cursor:help;border-bottom:1px dotted var(--muted);padding-bottom:1px}
.th-tip:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none;white-space:nowrap;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}
/* The last header's tooltip would overflow the table's horizontal scroll box and be
   clipped, so it is anchored to the right edge instead of centred. */
.stt th:last-child .th-tip:hover::after{left:auto;right:0;transform:none}
.stt th:last-child .th-tip:hover::before{left:auto;right:12px;transform:none}
.th-tip:hover::before{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#111;margin-top:4px;z-index:30;pointer-events:none}
.stt th{font-family:var(--ft);font-weight:900;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 14px;text-align:center;background:#0f0f0f}
.stt th:first-child{text-align:left;padding-left:20px;border-radius:var(--r) 0 0 var(--r)}
.stt th:nth-child(2){text-align:left;padding-left:6px}
.stt th:last-child{border-radius:0 var(--r) var(--r) 0}
/* tabular-nums keeps digits the same width so the numeric columns line up; without
   it a row of 1s renders narrower than a row of 8s and the columns visibly shift. */
.stt td{padding:14px 16px;text-align:center;font-family:var(--ft);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;background:var(--row);border-top:1px solid rgba(255,255,255,.02)}
.stt td:first-child{padding-left:20px;text-align:left;font-family:var(--ft);font-size:20px;font-weight:900}
.stt td:nth-child(2){text-align:left}.tc-n{font-family:var(--ft);font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.stt tr.pl td{background:var(--gold)}
/* Overpoints qualification bands: top 4 straight to the playoffs (same gold the
   standings use), 5th to 32nd into the wildcards, tinted lighter to read as a
   weaker qualification. */
.stt tr.ov-po td{background:var(--gold)}
.stt tr.ov-wc td{background:rgba(255,186,74,.17)}
.stt tr.br td{background:var(--bar)}
.stt tr.rl td{background:var(--rel)}
.stt tr.champ td{background:var(--champ)}
.rn{font-family:var(--ft);font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;display:inline-block;width:34px;text-align:center}
.tc{display:flex;align-items:center;gap:12px;min-width:190px}

/* Rank + logo share one continuous panel: the rank cell drops its right padding
   and the logo cell its left, so the two read as a single block. */
.stt td.rank-cell{padding-right:0}
/* The logo cell is the positioning context for the absolutely-placed panel. */
.stt td.team-cell{padding-left:0;position:relative}

/* Tilted logo cell. Both the logo and the window that crops it are angled at 15deg:
   the logo via rotate(), the window via a skewed clip-path polygon, so the crop
   edges run diagonally instead of vertically. No filter is applied: filters
   rasterize SVG logos at layout size before transforms, which visibly softens them. */
.tlogo-box{
  /* 14px over the 52px row height gives the reference's ~15deg lean. Expressed in
     px because clip-path percentages on the x-axis resolve against width, not height. */
  --tilt:14px;
  /* Absolutely placed and stretched to the cell's padding box, so the panel meets
     the top and bottom edges of the row while contributing nothing to its height.
     Shifted slightly left so it tucks further under the rank block. */
  position:absolute;top:0;bottom:0;left:-6px;
  /* Wide enough that the slanted right edge falls inside the box rather than being
     clipped flat by it. */
  width:100px;
  overflow:hidden;
  /* Parallelogram leaning left towards the bottom: both edges shift by the same
     amount, so the sides stay parallel like the reference shape. */
  clip-path:polygon(var(--tilt) 0, 100% 0, calc(100% - var(--tilt)) 100%, 0 100%);
  display:flex;align-items:center;justify-content:center;
}
/* Reserves the horizontal space the absolute panel occupies, plus a little extra
   so the team name sits clear of the panel's diagonal edge. */
.tc{padding-left:108px}
.tlogo-box>*{
  /* Sized directly: SVG logos stay vector-sharp under rotation, so no overscale
     trick is needed. Avoid adding any CSS filter here, which would rasterize them. */
  width:90px !important;height:90px !important;
  transform:rotate(15deg);
  transform-origin:center;
}
/* 10px gap between rows, per the reference spacing. border-spacing also inserts
   that gap between thead and tbody, so the body is pulled back up to sit flush
   against the header. */
.stt{border-spacing:0 10px !important}
.stt tbody{position:relative;top:-10px}
.stt td{border-top:none !important}
.tc img,.tc .tp{width:30px;height:30px;font-size:11px}
.tc-n{font-family:var(--ft);font-weight:900;font-size:16px;text-transform:uppercase}
.pts{font-family:var(--ft);font-weight:900;font-size:18px;color:var(--acc)}

/* legend */
.leg{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 0}
.li{display:flex;align-items:center;gap:8px;font-family:var(--ft);font-size:14px;font-weight:400;color:var(--muted)}
.ld3{width:16px;height:16px;flex-shrink:0}
.ld-pl{background:var(--gold-leg)}.ld-br{background:var(--bar-leg)}.ld-rl{background:var(--rel-leg)}.ld-champ{background:var(--champ-leg)}

/* ━━━ TOOLBAR ━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.tb-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.fb3{padding:6px 14px;background:rgba(255,255,255,.055);font-family:var(--ft);font-weight:900;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);transition:all .15s;border-radius:999px}

.ss{background:rgba(255,255,255,.1);color:var(--txt);padding:12px 40px 12px 18px;border-radius:8px;font-family:var(--ft);font-weight:700;font-size:15px;cursor:pointer;outline:none;border:none;text-align:left;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" viewBox="0 0 14 8"><path d="M1 1l6 6 6-6" stroke="%23FF6A00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');background-repeat:no-repeat;background-position:right 14px center;background-size:12px 7px}
.ss-cust{position:relative;display:inline-block}
.ss-cust .ss{display:block;width:100%}

.ss-opt{padding:9px 16px;border-radius:6px;font-family:var(--ft);font-weight:700;font-size:13px;color:var(--txt);cursor:pointer;transition:background .15s,color .15s}

.ss-opt.on{background:var(--acc-dim);color:var(--acc)}
.tb-bar-lg .ss{padding:15px 46px 15px 28px;font-size:18px;border-radius:8px;background-color:rgba(255,255,255,.1);background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" viewBox="0 0 14 8"><path d="M1 1l6 6 6-6" stroke="%23FF6A00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');background-repeat:no-repeat;background-position:right 18px center;background-size:14px 8px}
.lg-ctrl-row{align-items:center;justify-content:space-between;gap:12px}
.lg-ctrl-row .dtog{margin-bottom:0}
.ss-pill{display:inline-flex;align-items:center;height:36px;box-sizing:border-box}
.ss-pill .ss{height:30px;box-sizing:border-box;display:flex;align-items:center;padding:0 34px 0 20px;font-size:12px;font-weight:900;font-family:var(--ft);letter-spacing:.09em;text-transform:uppercase;border-radius:999px;background-position:right 14px center;background-size:11px 6px;line-height:normal}

/* ━━━ ARTICLES ━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.al{display:flex;flex-direction:column;gap:48px}
.al{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media(max-width:900px){.al{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.al{grid-template-columns:1fr}}
.ac{display:flex;flex-direction:column;background:transparent;overflow:hidden;cursor:pointer;transition:opacity .2s,outline .2s}
.ac:hover{opacity:1;outline:2px solid rgba(255,106,0,.55)}

.ac-img{width:100%;height:100%;object-fit:cover;background:var(--bg-c2);display:block;transition:transform .4s cubic-bezier(.25,.46,.45,.94)}
.ac-iph{aspect-ratio:16/9;background:var(--bg-c2);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:22px}
.ac-b{padding:14px 0 0;display:flex;flex-direction:column;gap:6px}
.ac-meta{display:flex;align-items:center;gap:12px;font-family:var(--ft);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:2px}
.ac-cat{color:var(--acc)}

// ─── STATE ─────────────────────────────────────────────────────────────────
const S = {

// ─── GViz FETCH (fetch + regex – works with public sheets) ──────────────────
async function gv(name) {
  const enc = encodeURIComponent(name);
  const urls = [
    'https://docs.google.com/spreadsheets/d/e/' + PUB_KEY + '/gviz/tq?tqx=out:json&headers=1&sheet=' + enc,
    'https://docs.google.com/spreadsheets/d/' + SID    + '/gviz/tq?tqx=out:json&headers=1&sheet=' + enc,
  ];
  for (let i = 0; i < urls.length; i++) {
    try {
      const res = await fetch(urls[i]);
      if (!res.ok) { console.warn('[GViz] HTTP', res.status, 'trying next:', name); continue; }
      const text = await res.text();
      // GViz wraps response: google.visualization.Query.setResponse({...});
      const m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]+?)\);?\s*$/);
      if (!m) { console.warn('[GViz] Bad response format, trying next:', name); continue; }
      const data = JSON.parse(m[1]);
      if (data?.status === 'error') { console.warn('[GViz] Sheet error:', name, data?.errors?.[0]?.message); continue; }
      const table = data?.table;
      if (!table) { console.warn('[GViz] No table in response:', name); continue; }
      // Detect Config fallback: GViz returns first sheet when tab name not found
      const cols = (table.cols||[]).map(c2=>(c2.label||c2.id||'').toLowerCase());
      const isConfigFallback = cols.length <= 3 && cols.some(c2=>c2.includes('site_name')||c2.includes('key_site'));
      if (isConfigFallback) { console.warn('[GViz] Config fallback detected for tab:', name, '(tab not found in sheet)'); continue; }
      return table;
    } catch(e) {
      console.warn('[GViz] Error (url', i+1, '):', name, e.message);
    }
  }
  console.error('[GViz] All URLs failed:', name);
  return null;
}

function cv(row, i) {
  const cell = row?.c?.[i];
  if (!cell) return null;
  const v = cell.v;
  // GViz returns dates as "Date(2026,3,10)" – month is 0-indexed
  if (typeof v === 'string' && v.startsWith('Date(')) {
    const m = v.match(/Date\((\d+),(\d+),(\d+)\)/);
    if (m) {
      const day=+m[3], mo=+m[2]+1, yr=+m[1];
      return (day<10?'0':'')+day+'/'+(mo<10?'0':'')+mo+'/'+yr;
    }
  }
  return v ?? cell.f ?? null;
}
function t2o(table) {
  if (!table?.rows) return [];
  const h = table.cols.map(c => (c.label||c.id).toLowerCase().replace(/[\s-]/g,'_').replace(/[^a-z0-9_]/g,''));
  return table.rows.filter(r => r.c?.some(c => c?.v != null)).map(r => {
    const o = {}; h.forEach((k, i) => { o[k] = cv(r, i); }); return o;
  });
}

// ─── LOADERS ───────────────────────────────────────────────────────────────
async function lCfg() {
  const t = await gv('Config'); if (!t) return;
  t2o(t).forEach(r => {
    if (r.key === 'active_split') { S.act = r.value || 'spring2026'; S.configActiveSplit = S.act; }
    if (r.key === 'season_year') S.seasonYear = String(r.value || '').trim();
    if (r.key === 'polling_interval_default') S.cfg.pd = +r.value || 600;
    if (r.key === 'polling_interval_match_day') S.cfg.pm = +r.value || 60;
  });
}

    const headerMapping = pairFrom(labels);
    let embedded = null;   // mapping picked up from an in-data header row, if any

    rows.forEach((r, ri) => {

      if (cells.includes('team_id') && cells.includes('ovpts')) { embedded = pairFrom(cells); return; }

      // Divisional blocks, via the tab's real headers.
      headerMapping.forEach(p => add(cv(r, p.team), cv(r, p.ov), sp.split_id, ri));
      // Continentals block, via an in-data header row when one was seen.
      if (embedded) embedded.forEach(p => add(cv(r, p.team), cv(r, p.ov), sp.split_id, ri));

      // Fallback for region rows that no header row announced: locate the region
      // label, then read the first text cell after it as the team and the first
      // number after that as the points (layout: division | rank | team_id | OVPTS).
      const regionAt = cells.findIndex(v => REGIONS.includes(v));

        }
        if (!isNaN(+raw)) { pts = +raw; break; }
      }
      if (team != null && pts != null) add(team, pts, sp.split_id, ri);

    .map(o => ({ ...o, team: byName[norm(o.team_name)] || null }))
    .sort((a, b) => b.pts - a.pts || a.team_name.localeCompare(b.team_name))
    .map((o, i) => ({ ...o, rank: i + 1 }));
}

// Open Qualifier regions: the sheet uses "NCSA" as the match_id prefix, but this is

const OQ_REGIONS = [

  { key:'APAC', label:'APAC', prefix:'APAC' },
  { key:'AMERICAS', label:'AMERICAS', prefix:'NCSA' },

function schedCatMatches(m, mode) {
  const d = String(m.division||'').toLowerCase().trim();
  // Matches "Div 1", "Division 1", "Div1", "Div 1 Playoffs", "Division 1 Playoffs"…
  // but not "Div 10" or anything else that merely starts with the same digit.
  if (mode === '1') return /^div(ision)?\s*1\b/.test(d) || d === '1' || d === 'barrage';
  if (mode === '2') return /^div(ision)?\s*2\b/.test(d) || d === '2' || d === 'promo' || d === 'promotion';
  if (mode === 'oq') return d === 'open qualifier';

}
// Which OQ round numbers actually exist (in the current split/region scope): generated

function schedOQRounds(regionKey, base) {

  if (!region) return [];
  const re = new RegExp('^' + region.prefix + '\\s+(\\d+)$', 'i');
  const rounds = new Set();
  base.forEach(m => {
    const mt = String(m.match_id||'').trim().match(re);
    if (mt) rounds.add(+mt[1]);
  });
  return [...rounds].sort((a,b) => a-b);
}
function schedFilteredMatches() {
  let ms = S.schedAllRows;
  if (S.schedSplit !== 'all') ms = ms.filter(m => m.split === S.schedSplit);
  ms = ms.filter(m => schedCatMatches(m, S.schedMode));
  if (S.schedMode === 'oq' && S.schedRegion) {
    const region = OQ_REGIONS.find(r => r.key === S.schedRegion);
    if (region) {
      ms = ms.filter(m => String(m.match_id||'').trim().toUpperCase().startsWith(region.prefix.toUpperCase()+' '));

    }

}

// Barrage (Div 1 ↔ Div 2) / Promotion (Div 2 ↔ Open) results section for the Standings pages.

function promoRelChevron(dir) {
  const color = dir === 'up' ? 'var(--acc)' : dir === 'down' ? '#fff' : 'var(--muted)';
  const path = dir === 'up' ? 'M4 16l8-9 8 9' : dir === 'down' ? 'M4 8l8 9 8-9' : 'M4 12h16';

  return outcome ? 'var(--acc)' : 'var(--muted)';
}
function promoRelSection(title, periodKey) {
  // Only ever show a result for a match explicitly tagged with this period AND belonging
  // to the split currently shown on this page: never one that leaked in from another split.
  const matches = S.sched.filter(m => derivePeriodFromDivision(m.division) === periodKey && m.split === S.act);
  const heading = `<div class="dt-md" style="font-family:var(--ft);margin:52px 0 20px">${title.toUpperCase()}</div>`;
  if (!matches.length) {
    return `${heading}<div class="empty"><p>No ${title.toLowerCase()} matches recorded for this split yet.</p></div>`;
  }
  const rankOf = teamId => {
    const id = (teamId||'').toString().trim().toLowerCase();
    const r1 = S.d1.find(r => (r.team_id||'').toLowerCase() === id);
    if (r1) return { rank: r1.rank, div: '1' };
    const r2 = S.d2.find(r => (r.team_id||'').toLowerCase() === id);
    if (r2) return { rank: r2.rank, div: '2' };
    return null;
  };
  // For a team not found in either division's standings (an Open/Continentals team), try
  // to figure out which region they qualified through, from their Open Qualifier matches.
  // Names can differ a lot between sheets ("Aurora X SKUF" vs "aurora_skuf"), so compare by
  // significant word overlap rather than exact/substring equality.
  const regionOfTeam = (teamId, teamName, teamShort) => {
    // Generic words that shouldn't count as a "match" on their own (too common across orgs)
    const STOP = new Set(['team','gaming','esports','squad','clan','crew','x','the']);
    const words = s => (s||'').toString().toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(w => w && !STOP.has(w));
    const candidates = [words(teamId), words(teamName), words(teamShort)].filter(w => w.length);
    // A team may have been renamed since qualifying (e.g. "SKUF Gaming" -> "aurora_skuf"), so a
    // single shared distinctive word (not just an exact full-name match) counts as the same team.
    const sameTeam = other => {
      const ow = words(other);
      if (!ow.length) return false;
      return candidates.some(c => c.some(w => ow.includes(w)));
    };
    const base = S.schedAllRows && S.schedAllRows.length ? S.schedAllRows : S.sched;
    const match = base.find(mm => schedCatMatches(mm, 'oq') && (sameTeam(mm.team_a_id) || sameTeam(mm.team_b_id)));
    if (!match) return null;
    const mid = String(match.match_id||'').trim().toUpperCase();
    const region = OQ_REGIONS.find(rg => mid.startsWith(rg.prefix.toUpperCase()+' '));

    // label literally changed: the winner always points up, the loser always points down
    // (e.g. a team that "Maintained" its division by winning still gets an up arrow).
    const dirOf = win => !hasScore ? 'flat' : (win ? 'up' : 'down');
    const placement = (r, team, id) => {
      if (r) return `${ordinal(r.rank)} in Div ${r.div}`;
      const region = regionOfTeam(id, team?.team_name, team?.team_short);
      return region ? `Continentals - ${region}` : 'Continentals';
    };
    // Grid rows: logo / name / placement / outcome: identical row heights across both
    // teams (via CSS Grid), so everything lines up vertically regardless of content length.
    return `<div class="mo-map" style="cursor:pointer;padding:32px 20px" onclick="openMatchModal('${m.match_id}')">
      <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;column-gap:32px;row-gap:14px;width:100%">
        <div style="grid-column:1;grid-row:1">${tlogo(m.A,68)}</div>
        <div style="grid-column:3;grid-row:1">${tlogo(m.B,68)}</div>
        <div style="grid-column:2;grid-row:1/span 4;display:flex;align-items:center;gap:12px">${promoRelChevron(dirOf(aWin))}${promoRelChevron(dirOf(!aWin))}</div>
        <div class="mo-tname" style="grid-column:1;grid-row:2;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.A?.team_name||m.team_a_id||'?'}</div>
        <div class="mo-tname" style="grid-column:3;grid-row:2;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.B?.team_name||m.team_b_id||'?'}</div>
        <div class="mo-players" style="grid-column:1;grid-row:3;font-size:13px">${placement(aRank, m.A, m.team_a_id)}</div>
        <div class="mo-players" style="grid-column:3;grid-row:3;font-size:13px">${placement(bRank, m.B, m.team_b_id)}</div>
        <div style="grid-column:1;grid-row:4;font-size:14px;font-weight:600;color:${promoRelOutcomeColor(aOutcome)}">${aOutcome||''}</div>
        <div style="grid-column:3;grid-row:4;font-size:14px;font-weight:600;color:${promoRelOutcomeColor(bOutcome)}">${bOutcome||''}</div>
      </div>

  }).join('');

let _schAutoScrolling = false;
function schedScrollTo(idx, smooth) {
  const list = document.getElementById('sch-list');
  const el = document.getElementById('sch-g-'+idx);
  if (!list || !el) return;
  const delta = el.getBoundingClientRect().top - list.getBoundingClientRect().top;
  _schAutoScrolling = true;
  list.scrollTo({ top: list.scrollTop + delta, behavior: smooth ? 'smooth' : 'auto' });
  clearTimeout(_schAutoScrollT);
  _schAutoScrollT = setTimeout(() => { _schAutoScrolling = false; }, smooth ? 500 : 120);
}
let _schAutoScrollT = null;
function schedUpdateBtn(g) {
  const btn = document.getElementById('sch-today-btn');
  if (btn && g) btn.textContent = schedGroupLabel(g.dO);
}
function schedNav(delta) {
  const groups = schedGroups();
  if (!groups.length) return;
  schIdx = delta===0 ? schedAnchorIdx(groups) : Math.min(Math.max(schIdx+delta,0), groups.length-1);
  schedScrollTo(schIdx, true);
  schedUpdateBtn(groups[schIdx]);
}
let _schScrollT = null;
function schedOnScroll() {
  clearTimeout(_schScrollT);
  _schScrollT = setTimeout(() => {
    if (_schAutoScrolling) return; // don't let our own auto-scroll clobber schIdx mid-flight
    const list = document.getElementById('sch-list');
    if (!list) return;
    const groups = schedGroups();
    const listTop = list.getBoundingClientRect().top;
    let idx = 0;
    document.querySelectorAll('#sch-list .date-group').forEach((g,i) => {
      if (g.getBoundingClientRect().top - listTop <= 48) idx = i;
    });
    schIdx = idx;
    schedUpdateBtn(groups[idx]);
  }, 60);
}

function fmtArtDate(raw) {
  if (!raw) return '';
  const mois=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const p = String(raw).replace(/\./g,'/').split('/');
  if (p.length===3) {
    const d=+p[0], m=+p[1]-1, y=+p[2];
    if (!isNaN(d)&&!isNaN(m)&&!isNaN(y)) return d+' '+(mois[m]||p[1])+' '+y;
  }
  return raw;
}

// Fetch & clean Google Doc published HTML
function docImgFallback(img) {
  const step = img.dataset.fallbackStep || '0';
  const original = img.dataset.originalSrc || img.src;
  if (!img.dataset.originalSrc) img.dataset.originalSrc = original;
  if (step === '0') {
    // Retry through a public image proxy (bypasses Google's CORP restriction on some links)
    img.dataset.fallbackStep = '1';
    img.src = 'https://images.weserv.nl/?url=' + encodeURIComponent(original.replace(/^https?:\/\//, ''));
    console.warn('[Doc image] direct load failed, retrying via proxy:', original);
  } else {
    console.warn('[Doc image] proxy retry also failed, giving up:', original);
    img.style.display = 'none';
  }
}
async function fetchDocContent(pubUrl, exportUrl) {
  try {
    const url = exportUrl || pubUrl;
    let res, html;
    try {
      res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      html = await res.text();
    } catch (e) {
      // If the export URL failed and we have a pub URL fallback, retry with it
      if (exportUrl && pubUrl && url !== pubUrl) {
        res = await fetch(pubUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        html = await res.text();
      } else {
        throw e;
      }
    }
    const parser = new DOMParser();
    const dom = parser.parseFromString(html, 'text/html');

    // Google Docs published/exported HTML: content is in #contents (pub) or body (export)
    const root = dom.querySelector('#contents') || dom.body;

    // Remove clutter
    root.querySelectorAll('script,style,header,footer,nav,.gb_,#docs-chrome').forEach(e=>e.remove());

    // Save images before stripping (preserve src, alt)
    root.querySelectorAll('img').forEach(img => {
      // Resolve relative URLs against the Google Doc base URL
      const base = url;
      let src = img.getAttribute('src') || img.getAttribute('data-src') || '';
      if (src && !src.startsWith('http')) {
        try { src = new URL(src, base).href; } catch(e) {}
      }
      const alt = img.getAttribute('alt') || '';
      // Remove all attrs then restore only what we need
      const attrNames = Array.from(img.attributes).map(a => a.name);
      attrNames.forEach(n => img.removeAttribute(n));
      if (src) img.setAttribute('src', src);
      if (alt) img.setAttribute('alt', alt);
      img.setAttribute('loading', 'lazy');
      img.setAttribute('onerror', "docImgFallback(this)");
    });

    // Strip clutter from all elements
    root.querySelectorAll('*').forEach(el => {
      const tag = el.tagName.toLowerCase();
      if (tag === 'img') return; // already handled above
      el.removeAttribute('class');
      el.removeAttribute('id');
      el.removeAttribute('style');
      el.removeAttribute('dir');
      el.removeAttribute('data-id');
      // Unwrap empty spans
      if (tag === 'span' && !el.querySelector('img,b,i,strong,em')) {
        el.replaceWith(...el.childNodes);
      }
    });

    // Remove Google's table-of-contents and metadata divs at top
    root.querySelectorAll('div:empty, hr').forEach(e => e.remove());

    // Extract content
    let content = root.innerHTML
      .replace(/ (class|id|style|dir|jsname|jsshadow|data-[^=]*)="[^"]*"/gi, '')
      .replace(/ {2,}/g, ' ')
      .replace(/<p>\s*(&nbsp;|\s)*<\/p>/gi, '')
      .replace(/<h[1-6]>\s*<\/h[1-6]>/gi, '')
      .trim();

    // Extract first paragraph as excerpt
    const firstP = root.querySelector('p');
    const excerpt = firstP ? firstP.textContent.replace(/\s+/g,' ').slice(0, 220).trim() : '';

    return { content, excerpt };
  } catch(e) {
    console.warn('[Doc] Failed to fetch doc:', e.message);
    return null;
  }
}

// renderInPlace – updates content WITHOUT scrolling (toggles, filters…)
function renderInPlace() {
  const parent = NAV_PARENT[S.page] || S.page;
  document.querySelectorAll('.nlk').forEach(el => el.classList.toggle('on', el.dataset.p === parent));
  const fn = PAGES[S.page] || pgHome;
  document.getElementById('app').innerHTML = fn();
  if (S.page === 'home') { _ytReady = false; _ytPlayer = null; _ytMuted = true; setTimeout(initYTPlayer, 150); }
  if (S.page === 'schedule') {
    const schTargetIdx = schIdx;
    requestAnimationFrame(() => { schedScrollTo(schTargetIdx, false); });
    // Webfont swap-in and logo images loading after the initial paint can shift card
    // heights just enough to throw off the scroll anchor (cropping the date header while
    // still showing that day's matches). Re-snap once things have actually settled.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => schedScrollTo(schTargetIdx, false));
    setTimeout(() => schedScrollTo(schTargetIdx, false), 350);
  }
}

// Reflects the current page in the URL (e.g. yoursite.com/#schedule) so pages can be
// bookmarked/shared directly and the browser's back/forward buttons work as expected.
const PAGE_TITLES = {
  home:'OverDrive', leagues:'Standings – OverDrive', standings:'Standings – OverDrive',
  schedule:'Schedule – OverDrive', news:'News – OverDrive', articles:'News – OverDrive',
  article:'News – OverDrive', vods:'VODs – OverDrive',
  teams:'Teams – OverDrive', ranking:'Power Ranking – OverDrive', overpoints:'Overpoints – OverDrive', about:'About – OverDrive',
  contact:'Contact – OverDrive', legal:'Legal Notice – OverDrive', privacy:'Privacy – OverDrive',
};
let _navigatingViaGo = false;
function pageFromHash() {
  const h = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
  return PAGES[h] ? h : 'home';
}
function syncHash(page) {
  document.title = PAGE_TITLES[page] || 'OverDrive';
  const desired = page === 'home' ? '' : page;
  if ((location.hash || '').replace(/^#\/?/, '') !== desired) {
    _navigatingViaGo = true;
    location.hash = desired;
  }
}
window.addEventListener('hashchange', () => {
  if (_navigatingViaGo) { _navigatingViaGo = false; return; } // already handled by go()
  const p = pageFromHash();
  if (p === S.page) return;
  S.page = p;
  renderInPlace();
  window.scrollTo({ top: 0 });
  document.title = PAGE_TITLES[p] || 'OverDrive';
});

    const fn = PAGES[S.page] || pgHome;
    document.getElementById('app').innerHTML = '<div class="pg">' + warn + fn() + '</div>';

}

// ─── MODAL ─────────────────────────────────────────────────────────────────
function openMatchModal(matchId) {
  const fromMain = S.sched.find(x => x.match_id === matchId);
  const m = fromMain || S.homeSched.find(x => x.match_id === matchId);
  if (!m) return;
  // Whichever array the match actually came from: keeps "recent form" consistent with
  // the same split, instead of assuming S.res (which tracks whatever S.act currently is).
  const matchSource = fromMain ? S.sched : S.homeSched;
  const isDone = m.status === 'DONE';
  const isLive = (m.status||''). toUpperCase() === 'LIVE';

  const sa = m.score_a ?? '', sb2 = m.score_b ?? '';
  const hasScore = (isDone||isLive) && sa!=='' && sb2!=='';
  const scoreHtml = hasScore
    ? `<div class="mo-sc">${sa} <span style="color:var(--muted);font-weight:300">-</span> ${sb2}</div>`
    : `<div class="mo-ti">${m.time_cest||'—:——'}</div>`;

  const logoA = mlogo(m.A);
  const logoB = mlogo(m.B);

  const teamA = S.teams[m.team_a_id];
  const teamB = S.teams[m.team_b_id];
  const playersA = [teamA?.player1, teamA?.player2].filter(Boolean).join(' & ');
  const playersB = [teamB?.player1, teamB?.player2].filter(Boolean).join(' & ');

  // Recent form (last 3 matches for each team)
  function recentForm(teamId, excludeMatchId) {
    return matchSource
      .filter(rx => rx.match_id !== excludeMatchId && (rx.team_a_id === teamId || rx.team_b_id === teamId) && rx.score_a != null && rx.score_b != null && rx.score_a !== '' && rx.score_b !== '')
      .slice(-3).reverse()
      .map(rx => {
        const isA = rx.team_a_id === teamId;
        const opponent = S.teams[isA ? rx.team_b_id : rx.team_a_id]?.team_name || (isA ? rx.team_b_id : rx.team_a_id);
        const scoreA = rx.score_a ?? '?', scoreB = rx.score_b ?? '?';
        const myScore = isA ? scoreA : scoreB, oppScore = isA ? scoreB : scoreA;
        const won = +myScore > +oppScore;
        const div = rx.division || '';
        return `<div class="mo-result">
  <div><div class="mo-res-meta">${div}</div><div class="mo-res-vs">vs ${opponent}</div></div>
  <div class="mo-res-right">
    <span class="mo-res-score">${myScore} - ${oppScore}</span>
    <span class="mo-res-badge ${won?'win-b':'loss-b'}">${won?'Win':'Loss'}</span>
  </div>
</div>`;
      }).join('') || '<div style="color:var(--dim);font-size:12px;padding:8px 0">No recent matches</div>';
  }

  // Map details
  let detailSection = '';
  if (isDone && m) {
    const maps = [];
    for (let i = 1; i <= 5; i++) {
      const ta = m[`track${i}_a`], tb = m[`track${i}_b`];
      if (ta != null && tb != null && ta !== '') {
        const mapName = m[`track${i}`] || m[`track${i}_name`] || m[`track${i}_map`] || m[`track${i}map`] || m[`map${i}_name`] || m[`map${i}`] || `Track ${i}`;
        maps.push({num:i, name:mapName, scoreA:ta, scoreB:tb});
      }
    }
    if (maps.length) {
      const mapsHtml = maps.map(mp => {
        const aWon = +mp.scoreA > +mp.scoreB;
        const scoreHtml2 = `<span style="color:${aWon?'var(--txt)':'var(--muted)'}">${mp.scoreA}</span> <span style="color:var(--dim)">-</span> <span style="color:${!aWon?'var(--txt)':'var(--muted)'}">${mp.scoreB}</span>`;
        return `<div class="mo-map">
  <div class="mo-map-name">${mp.name}</div>
  <div class="mo-map-score">${scoreHtml2}</div>
</div>`;
      }).join('');
      detailSection = `<div class="mo-section">
<div class="mo-sh">Map details</div>
<div class="mo-maps">${mapsHtml}</div>
</div>`;
    }
  } else if (!isDone) {
    const formHtml = `<div class="mo-section">
<div class="mo-sh">Recent form</div>
<div class="mo-form">
<div class="mo-form-col">
  <div class="mo-form-hd">${mlogoSm(m.A)}<div><div class="mo-form-tname">${m.A?.team_name||'?'}</div><div class="mo-form-sub">Recent results</div></div></div>
  ${recentForm(m.team_a_id, matchId)}
</div>
<div class="mo-form-col">
  <div class="mo-form-hd">${mlogoSm(m.B)}<div><div class="mo-form-tname">${m.B?.team_name||'?'}</div><div class="mo-form-sub">Recent results</div></div></div>
  ${recentForm(m.team_b_id, matchId)}
</div>
</div>
</div>`;
    detailSection = formHtml;
  }

  const splitLabel = (S.splits.find(s => s.split_id === m.split)?.label) || m.split || (S.splits.find(s => s.split_id === S.act)?.label) || S.act || 'OverDrive 2026';
  document.getElementById('modal-content').innerHTML = `
<div class="mo-hd">
  <div class="mo-bc">${matchDivLabelFull(m)||'—'}<span>-</span>${isDone?'Finished':isLive?'Live':'Upcoming'}<span>-</span>${splitLabel}</div>
  <button class="mo-close" onclick="closeModal()">Close</button>
</div>
<div class="mo-main">
  <div class="mo-team">
    ${logoA}
    <div class="mo-tname">${m.A?.team_name||m.team_a_id||'?'}</div>
    ${playersA?`<div class="mo-players">Players - ${playersA}</div>`:''}
  </div>
  <div class="mo-center">
    ${scoreHtml}
  </div>
  <div class="mo-team">
    ${logoB}
    <div class="mo-tname">${m.B?.team_name||m.team_b_id||'?'}</div>
    ${playersB?`<div class="mo-players">Players - ${playersB}</div>`:''}
  </div>
</div>
${detailSection}`;
  document.getElementById('modal-ov').classList.add('open');
  document.body.style.overflow = 'hidden';
}

  document.getElementById('modal-ov').classList.remove('open');

// Driven by JS rather than CSS :hover, which closes the menu the instant the pointer
// leaves the element and makes the submenu hard to reach. Open/close is explicit state
// with a close delay, so imperfect pointer paths still work.
const DD_CLOSE_DELAY = 2000;  // ms the menu stays open after the pointer leaves it
const DD_SUB_DELAY   = 400;   // ms before a nested submenu collapses
const DD_OPEN_DELAY  = 60;    // ms before opening, avoids flicker when passing over

function initNavDropdowns() {
  document.querySelectorAll('.nav-item').forEach(item => {
    const dd = item.querySelector('.dd');
    if (!dd) return;                       // plain nav links have no dropdown
    let closeTimer = null, openTimer = null;

    const closeAll = () => {
      item.classList.remove('open');
      item.querySelectorAll('.ddi-sub.open').forEach(s => s.classList.remove('open'));
    };
    const open = () => {
      clearTimeout(closeTimer); clearTimeout(openTimer);
      document.querySelectorAll('.nav-item.open').forEach(o => {
        if (o !== item) { o.classList.remove('open'); o.querySelectorAll('.ddi-sub.open').forEach(s => s.classList.remove('open')); }
      });
      item.classList.add('open');
    };
    const scheduleOpen = () => { clearTimeout(closeTimer); clearTimeout(openTimer); openTimer = setTimeout(open, DD_OPEN_DELAY); };

    item.addEventListener('mouseenter', scheduleOpen);

    // "Inside" is decided by geometry rather than element boundaries: a hidden .dd
    // has pointer-events:none and can never receive mouseenter. Tracking coordinates
    // also covers the gap between the button and the panel.
    const PAD = 14;
    const within = (r, x, y) => x >= r.left-PAD && x <= r.right+PAD && y >= r.top-PAD && y <= r.bottom+PAD;
    document.addEventListener('mousemove', e => {
      const overItem = within(item.getBoundingClientRect(), e.clientX, e.clientY);
      // Not gated on the menu being open: the panel keeps its geometry when hidden,
      // and gating here would make it impossible to reopen by moving back onto it.
      const overDD   = within(dd.getBoundingClientRect(), e.clientX, e.clientY);
      let overSub = false;
      item.querySelectorAll('.ddi-sub').forEach(sub => {
        const sm = sub.querySelector('.dd-sub');
        if (sub.classList.contains('open') && sm && within(sm.getBoundingClientRect(), e.clientX, e.clientY)) overSub = true;
      });

      if (overItem || overDD || overSub) {
        if (!item.classList.contains('open')) scheduleOpen();
        else if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
      } else if (item.classList.contains('open')) {
        if (!closeTimer) closeTimer = setTimeout(() => { closeAll(); closeTimer = null; }, DD_CLOSE_DELAY);
      }

      // Nested submenus follow the same geometric rule.
      if (item.classList.contains('open')) {
        item.querySelectorAll('.ddi-sub').forEach(sub => {
          const sm = sub.querySelector('.dd-sub');
          if (!sm) return;
          // Measured against the row, not the container: an open container includes
          // its expanded panel, whose box would overlap the row of the next submenu
          // down and keep the wrong one open.
          const rowEl = sub.querySelector('.ddi-sub-row') || sub;
          const overRow = within(rowEl.getBoundingClientRect(), e.clientX, e.clientY);
          const overPanel = sub.classList.contains('open') && within(sm.getBoundingClientRect(), e.clientX, e.clientY);
          if (overRow || overPanel) { clearTimeout(sub._t); sub._t = null; sub.classList.add('open'); }
          else if (sub.classList.contains('open') && !sub._t) {
            sub._t = setTimeout(() => { sub.classList.remove('open'); sub._t = null; }, DD_SUB_DELAY);
          }
        });
      }
    });

    // Clicking a destination should dismiss the menu straight away. Delegated from
    // the nav item so it survives re-renders, and using capture so it still fires
    // for submenu entries that call stopPropagation.
    item.addEventListener('click', () => {
      clearTimeout(closeTimer); clearTimeout(openTimer); closeAll();
    }, true);
    const label = item.querySelector('.nlk');
    if (label) label.addEventListener('focus', open);
  });

  // Close everything on outside click or Escape.
  document.addEventListener('click', e => {
    if (!e.target.closest('.nav-item')) {
      document.querySelectorAll('.nav-item.open,.ddi-sub.open').forEach(o => o.classList.remove('open'));
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.nav-item.open,.ddi-sub.open').forEach(o => o.classList.remove('open'));
  });
}
initNavDropdowns();

async function init() {
  // Direct/shared links (e.g. #schedule) should open straight on that page
  S.page = pageFromHash();
  // Detect file:// protocol – GViz fetch() is blocked by browser security
  if (location.protocol === 'file:') {
    document.getElementById('app').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;padding:40px;text-align:center">
        <div style="font-size:48px">⚠️</div>
        <div style="font-family:'Area Extended',sans-serif;font-size:28px;color:#FF6A00">Local server required</div>
        <div style="color:#aaa;max-width:520px;line-height:1.7;font-size:15px">
          The browser blocks requests to Google Sheets from a local file (<code style="color:#FF6A00">file://</code>).<br><br>
          Start a local server in the file's folder:
        </div>
        <div style="background:#111;border:1px solid #333;padding:16px 28px;font-family:monospace;font-size:16px;color:#4ade80;letter-spacing:.5px">
          python3 -m http.server 8080
        </div>
        <div style="color:#aaa;font-size:14px">
          Then open: <a href="http://localhost:8080/overdrive.html" style="color:#FF6A00">http://localhost:8080/overdrive.html</a>
        </div>
      </div>`;
    return;
  }
  document.getElementById('app').innerHTML = '<div class="ldg"><div class="sp"></div><span class="ldg-l">Loading…</span></div>';

  // Safety timeout – render anyway after 8s
  const safetyTimer = setTimeout(() => {
    console.warn('Timeout: rendering with available data');
    render(); poll();
  }, 8000);

  try {
    await lCfg();
    await lSplits();
    await lTeams();
    await Promise.all([lSched(S.act), lStand(S.act), lRes(S.act), lArt(), lVod(), lRank(), lOver(), loadHomeSplitData(), loadScheduleAllSplits()]);
  } catch(e) {
    console.error('Init error:', e);
  } finally {
    clearTimeout(safetyTimer);
    render(); poll();
  }
}
init();

// ─── YOUTUBE PLAYER ────────────────────────────────────────────────────────
var _ytPlayer = null, _ytMuted = true, _ytReady = false;

function initYTPlayer() {
  const el = document.getElementById('yt-player');
  if (!el) return;
  if (!window.YT || !window.YT.Player) {
    // API not loaded yet – load it
    if (!document.getElementById('yt-api-script')) {
      const tag = document.createElement('script');
      tag.id = 'yt-api-script';
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }
    // onYouTubeIframeAPIReady will call initYTPlayer again
    return;
  }
  _ytPlayer = new YT.Player('yt-player', {
    events: {
      onReady: function(e) {
        _ytReady = true;
        e.target.mute();
        e.target.playVideo();
      }
    }
  });
}

window.onYouTubeIframeAPIReady = function() { initYTPlayer(); };

window.ytToggleSound = function() {
  if (!_ytReady || !_ytPlayer) return;
  if (_ytMuted) {
    _ytPlayer.unMute();
    _ytPlayer.setVolume(100);
    const btn = document.getElementById('yt-sound');
    if (btn) btn.textContent = '🔊';
  } else {
    _ytPlayer.mute();
    const btn = document.getElementById('yt-sound');
    if (btn) btn.textContent = '🔇';
  }
  _ytMuted = !_ytMuted;
};
